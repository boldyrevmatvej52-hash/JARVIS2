<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>J.A.R.V.I.S</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-touch-callout: none; overscroll-behavior: none; cursor: pointer; }
  body {
    background: radial-gradient(ellipse at center, #0d1b2a 0%, #050810 70%, #000 100%);
    color: #7dd3fc; font-family: 'Consolas', 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
    transition: background 0.5s, filter 0.5s;
    overflow-y: auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body.theme-blue    { background: radial-gradient(ellipse at center, #0d1b2a 0%, #050810 70%, #000 100%); color: #7dd3fc; }
  body.theme-red     { background: radial-gradient(ellipse at center, #2a0d0d 0%, #100505 70%, #000 100%); color: #ff9999; }
  body.theme-green   { background: radial-gradient(ellipse at center, #0d2a15 0%, #051008 70%, #000 100%); color: #88ffb0; }
  body.theme-purple  { background: radial-gradient(ellipse at center, #1f0d2a 0%, #0a0510 70%, #000 100%); color: #c9a0ff; }
  body.theme-orange  { background: radial-gradient(ellipse at center, #2a1a0d 0%, #100a05 70%, #000 100%); color: #ffbb77; }

  body.night-mode { filter: brightness(0.6) contrast(1.1); }
  body.night-mode::after {
    content: '🌙 НОЧНОЙ РЕЖИМ';
    position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 15px;
    background: #000000aa; padding: 5px 12px;
    border-radius: 20px; font-size: 11px;
    color: #7dd3fc; z-index: 200; letter-spacing: 2px;
    border: 1px solid #00d4ff44;
  }

  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container {
    position: relative; z-index: 1;
    width: 900px; max-width: 95vw; max-height: 95vh;
    text-align: center; animation: fadeIn 1.2s ease;
    padding: 10px;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  h1 {
    color: #00d4ff; font-size: 42px; letter-spacing: 14px; font-weight: 700;
    text-shadow: 0 0 10px #00d4ff, 0 0 25px #00d4ff88, 0 0 50px #00d4ff44;
    margin-bottom: 6px; animation: glow 3s ease-in-out infinite;
    transition: color 0.5s, text-shadow 0.5s;
  }
  body.theme-red h1    { color: #ff4444; text-shadow: 0 0 10px #ff4444, 0 0 25px #ff444488; }
  body.theme-green h1  { color: #22ff88; text-shadow: 0 0 10px #22ff88, 0 0 25px #22ff8888; }
  body.theme-purple h1 { color: #c084fc; text-shadow: 0 0 10px #c084fc, 0 0 25px #c084fc88; }
  body.theme-orange h1 { color: #ff8800; text-shadow: 0 0 10px #ff8800, 0 0 25px #ff880088; }

  @keyframes glow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
  .subtitle { color: #4a9ebe; font-size: 11px; letter-spacing: 6px; margin-bottom: 15px; }
  .reactor-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 12px; }
  canvas#reactor { display: block; }
  .status { font-size: 13px; letter-spacing: 4px; color: #4a9ebe; margin-bottom: 12px; transition: all 0.3s; font-weight: 700; }
  .status.listening { color: #00ff88; text-shadow: 0 0 12px #00ff88; }
  .status.speaking  { color: #ff8800; text-shadow: 0 0 12px #ff8800; }
  .status.thinking  { color: #c084fc; text-shadow: 0 0 12px #c084fc; }

  .log {
    background: #050810cc; border: 1px solid #0d2538; border-radius: 12px;
    height: 150px; min-height: 100px; max-height: 60vh;
    overflow-y: auto; padding: 12px 18px;
    text-align: left; font-size: 13px; line-height: 1.7; margin-bottom: 12px;
    box-shadow: inset 0 0 40px #00d4ff11; backdrop-filter: blur(5px);
    resize: vertical;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-track { background: transparent; }
  .log::-webkit-scrollbar-thumb { background: #0d2538; border-radius: 3px; }
  .log-entry { margin-bottom: 4px; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  .log-entry .time { color: #4a9ebe; font-size: 11px; }
  .log-entry.user .who   { color: #7dd3fc; font-weight: 700; }
  .log-entry.jarvis .who { color: #00d4ff; font-weight: 700; }
  .log-entry.system .who { color: #c084fc; font-weight: 700; }
  .log img { max-width: 200px; border-radius: 8px; margin-top: 6px; display: block; border: 2px solid #00d4ff44; }
  .log a { color: #00d4ff; text-decoration: underline; cursor: pointer; }

  .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
  input[type="text"] {
    flex: 1; background: #050810; color: #00d4ff;
    border: 1px solid #0d2538; border-radius: 10px;
    padding: 13px 18px; font-family: inherit; font-size: 14px;
    outline: none; transition: all 0.2s;
  }
  input[type="text"]:focus { border-color: #00d4ff; box-shadow: 0 0 20px #00d4ff44; }
  input[type="text"]::placeholder { color: #4a9ebe; }

  .buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button {
    background: linear-gradient(180deg, #0d2538, #081a28);
    color: #00d4ff; border: 1px solid #1a3a52; border-radius: 10px;
    padding: 10px 14px; font-family: inherit; font-size: 11px;
    font-weight: 700; letter-spacing: 1.5px; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 0 15px #00d4ff22;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    -webkit-appearance: none; appearance: none;
  }
  button:hover:not(:disabled) { background: linear-gradient(180deg, #153a52, #0d2538); border-color: #00d4ff; box-shadow: 0 0 25px #00d4ff66; transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  button.recording { background: linear-gradient(180deg, #ff3355, #aa1a33); color: white; border-color: #ff3355; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 15px #ff335588; } 50% { box-shadow: 0 0 35px #ff3355cc; } }
  button.send-btn { padding: 12px 22px; font-size: 16px; }
  button#rbxBtn { color: #ff5555; border-color: #6b1a1a; }
  button#weatherBtn { color: #7dd3fc; border-color: #1a4d6b; }
  button#notesBtn { color: #ffcc00; border-color: #6b5010; }
  button#themeBtn { color: #c084fc; border-color: #4a1a6b; }
  button#imgBtn { color: #ff88ff; border-color: #6b1a6b; }
  button#nightBtn { color: #8888ff; border-color: #1a1a6b; }
  button#gestureBtn { color: #ffaa00; border-color: #6b5010; }
  button#kazanBtn { color: #00ff88; border-color: #1a6b4a; }
  button#translateBtn { color: #00d4ff; border-color: #1a4d6b; }

  .panel {
    position: fixed; top: 0; right: -100vw;
    width: 400px; height: 100vh;
    background: #0a0e17f0;
    border-left: 2px solid #00d4ff;
    box-shadow: -10px 0 40px #00d4ff44;
    backdrop-filter: blur(10px);
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
    transition: right 0.4s ease;
    z-index: 100;
    display: flex; flex-direction: column;
    text-align: left;
  }
  .panel.open { right: 0; }
  .panel h2 { color: #00d4ff; font-size: 18px; letter-spacing: 3px; margin-bottom: 15px; text-align: center; }
  .panel .close-btn {
    position: absolute; top: calc(15px + env(safe-area-inset-top)); right: 15px;
    background: transparent; border: 1px solid #ff5566;
    color: #ff5566; padding: 8px 14px; font-size: 16px;
    border-radius: 6px; cursor: pointer;
    min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .notes-list { flex: 1; overflow-y: auto; background: #050810; border: 1px solid #0d2538; border-radius: 10px; padding: 10px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .note-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; margin-bottom: 6px; background: #0d1a24; border-left: 3px solid #00d4ff; border-radius: 6px; font-size: 14px; }
  .note-item.done { opacity: 0.5; text-decoration: line-through; border-left-color: #00ff88; }
  .note-item .note-text { flex: 1; color: #7dd3fc; word-break: break-word; }
  .note-item .note-time { font-size: 10px; color: #4a9ebe; margin-left: 8px; }
  .note-item .note-actions { display: flex; gap: 5px; margin-left: 8px; }
  .note-item button { padding: 8px 12px; font-size: 13px; border-radius: 4px; min-width: 40px; min-height: 40px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .note-item .done-btn { color: #00ff88; border-color: #1a6b4a; }
  .note-item .del-btn { color: #ff5566; border-color: #6b1a1a; }
  .panel-input-row { display: flex; gap: 8px; }
  .panel-input-row input { flex: 1; background: #050810; color: #00d4ff; border: 1px solid #0d2538; border-radius: 8px; padding: 12px; font-family: inherit; font-size: 14px; outline: none; }
  .panel-input-row button { padding: 12px 20px; font-size: 14px; min-width: 50px; }

  .camera-panel {
    position: fixed; bottom: 20px; right: 20px;
    width: 240px;
    background: #0a0e17f0;
    border: 2px solid #ffaa00;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 0 30px #ffaa0066;
    display: none; z-index: 100;
  }
  .camera-panel.active { display: block; }
  .camera-panel video { width: 100%; border-radius: 8px; display: block; transform: scaleX(-1); }
  .camera-panel .gesture-info { text-align: center; margin-top: 8px; font-size: 12px; color: #ffaa00; letter-spacing: 2px; }
  .camera-panel .gesture-hints { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ffaa0033; font-size: 10px; color: #7dd3fc; line-height: 1.5; }

  .stats { display: flex; gap: 15px; justify-content: center; margin-top: 10px; font-size: 10px; color: #4a9ebe; letter-spacing: 2px; flex-wrap: wrap; }
  .stats span b { color: #00d4ff; }
  .stats span b.ok { color: #00ff88; }
  .stats span b.bad { color: #ff5566; }

  @media (max-width: 768px) {
    html, body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body { padding: 10px 0 20px 0; align-items: flex-start; min-height: 100vh; min-height: 100dvh; }
    .container { max-height: none; padding: 5px 10px; width: 100%; }
    h1 { font-size: 28px; letter-spacing: 8px; margin-top: 10px; margin-bottom: 4px; }
    .subtitle { font-size: 9px; letter-spacing: 3px; margin-bottom: 10px; }
    .reactor-wrap { width: 140px; height: 140px; margin: 0 auto 10px; }
    canvas#reactor { width: 140px; height: 140px; }
    .status { font-size: 12px; letter-spacing: 2px; margin-bottom: 10px; }
    .log { height: 140px; min-height: 100px; font-size: 12px; padding: 10px 12px; resize: none; -webkit-overflow-scrolling: touch; }
    .input-row { flex-wrap: nowrap; gap: 8px; margin-bottom: 10px; }
    input[type="text"] { font-size: 16px; padding: 14px 14px; min-height: 48px; }
    button.send-btn { padding: 14px 18px; font-size: 18px; min-width: 56px; min-height: 48px; }
    .buttons { gap: 6px; margin-bottom: 10px; }
    button { padding: 12px 10px; font-size: 10px; letter-spacing: 0.5px; min-height: 48px; min-width: 48px; flex: 1 1 calc(33.33% - 6px); max-width: calc(33.33% - 6px); }
    .panel { width: 100vw; max-width: 100vw; right: -100vw; }
    .panel.open { right: 0; }
    .stats { font-size: 9px; gap: 8px; margin-top: 8px; }
    .camera-panel { width: 160px; bottom: 10px; right: 10px; }
  }
  @media (max-width: 480px) {
    h1 { font-size: 24px; letter-spacing: 6px; }
    .reactor-wrap { width: 120px; height: 120px; }
    canvas#reactor { width: 120px; height: 120px; }
    button { font-size: 9px; padding: 10px 8px; flex: 1 1 calc(50% - 6px); max-width: calc(50% - 6px); min-height: 44px; }
    .log { height: 120px; font-size: 11px; }
    .stats { font-size: 8px; letter-spacing: 1px; }
    .stats span { flex: 1 1 45%; text-align: center; }
  }
  @media (max-width: 360px) {
    h1 { font-size: 20px; letter-spacing: 4px; }
    .subtitle { font-size: 8px; }
    .reactor-wrap { width: 100px; height: 100px; }
    canvas#reactor { width: 100px; height: 100px; }
    button { font-size: 8px; padding: 8px 6px; }
  }
  @media (max-width: 900px) and (orientation: landscape) {
    body { align-items: flex-start; }
    .container { max-width: 100%; }
    .reactor-wrap { width: 100px; height: 100px; }
    canvas#reactor { width: 100px; height: 100px; }
    h1 { font-size: 22px; letter-spacing: 6px; }
    .log { height: 100px; }
    button { min-height: 42px; font-size: 10px; }
  }
  @media (hover: none) {
    button:hover { transform: none !important; box-shadow: 0 0 15px #00d4ff22 !important; background: linear-gradient(180deg, #0d2538, #081a28) !important; border-color: #1a3a52 !important; }
  }
</style>
</head>
<body class="theme-blue" ontouchstart="">

<canvas id="particles"></canvas>

<div class="panel" id="notesPanel">
  <button class="close-btn" onclick="toggleNotes()">✕</button>
  <h2>📝 МОИ ЗАМЕТКИ</h2>
  <div class="notes-list" id="notesList"></div>
  <div class="panel-input-row">
    <input type="text" id="noteInput" placeholder="Новая заметка..." autocomplete="off">
    <button onclick="addNoteFromInput()">+</button>
  </div>
</div>

<div class="camera-panel" id="cameraPanel">
  <video id="gestureVideo" autoplay muted playsinline></video>
  <div class="gesture-info" id="gestureInfo">Покажите руку</div>
  <div class="gesture-hints">
    ☝️ погода · ✌️ время · 🤟 факт<br>
    🖖 <b style="color:#00ff88;">микрофон</b> · ✋ картинка<br>
    👏 <b style="color:#00ff88;">хлопок — Казань</b> · ✊ стоп
  </div>
</div>

<div class="container">
  <h1>J.A.R.V.I.S</h1>
  <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

  <div class="reactor-wrap">
    <canvas id="reactor" width="220" height="220"></canvas>
  </div>

  <div class="status" id="status">● ОЖИДАНИЕ</div>
  <div class="log" id="log"></div>

  <div class="input-row">
    <input type="text" id="cmdInput" placeholder='Спросите что угодно...' autocomplete="off">
    <button class="send-btn" id="sendBtn">▶</button>
  </div>

  <div class="buttons">
    <button id="micBtn">🎤 СЛУШАТЬ</button>
    <button id="translateBtn">🌍 ПЕРЕВОД</button>
    <button id="gestureBtn">✋ ЖЕСТЫ</button>
    <button id="kazanBtn">🌆 КАЗАНЬ</button>
    <button id="imgBtn">🎨 РИСУНОК</button>
    <button id="notesBtn">📝 ЗАМЕТКИ</button>
    <button id="nightBtn">🌙 НОЧЬ</button>
    <button id="weatherBtn">🌤 ПОГОДА</button>
    <button id="themeBtn">🎨 ТЕМА</button>
    <button id="rbxBtn">🎮 ROBLOX</button>
    <button id="voiceBtn">🔊 ГОЛОС</button>
    <button id="stopBtn">🔇 СТОП</button>
    <button id="clearBtn">🗑 ОЧИСТИТЬ</button>
  </div>

  <div class="stats">
    <span>TIME: <b id="time">--:--:--</b></span>
    <span>DATE: <b id="date">--.--.----</b></span>
    <span>MIC: <b id="micState" class="bad">--</b></span>
    <span>NIGHT: <b id="nightState">OFF</b></span>
    <span>NOTES: <b id="notesCount">0</b></span>
  </div>
</div>

<script>
// ============================================================
//              НОЧНОЙ РЕЖИМ
// ============================================================
let nightMode = false;
let nightManual = localStorage.getItem('jarvis_night_manual') || 'auto';

function checkNightMode() {
  const h = new Date().getHours();
  const isNight = h >= 23 || h < 6;
  let shouldBeNight = false;
  if (nightManual === 'on') shouldBeNight = true;
  else if (nightManual === 'off') shouldBeNight = false;
  else shouldBeNight = isNight;
  if (shouldBeNight !== nightMode) {
    nightMode = shouldBeNight;
    document.body.classList.toggle('night-mode', nightMode);
    const el = document.getElementById('nightState');
    if (el) el.textContent = nightMode ? 'ON' : 'OFF';
  }
}
checkNightMode();
setInterval(checkNightMode, 60000);

function toggleNightMode() {
  if (nightManual === 'auto') nightManual = 'on';
  else if (nightManual === 'on') nightManual = 'off';
  else nightManual = 'auto';
  localStorage.setItem('jarvis_night_manual', nightManual);
  checkNightMode();
  const labels = { auto: 'автоматический', on: 'включён', off: 'выключен' };
  return `Ночной режим ${labels[nightManual]}`;
}

// ============================================================
//              ЗАМЕТКИ
// ============================================================
let notes = JSON.parse(localStorage.getItem('jarvis_notes') || '[]');

function saveNotes() {
  localStorage.setItem('jarvis_notes', JSON.stringify(notes));
  updateNotesCount();
}

function updateNotesCount() {
  const el = document.getElementById('notesCount');
  if (el) el.textContent = notes.filter(n => !n.done).length;
}

function renderNotes() {
  const list = document.getElementById('notesList');
  if (!list) return;
  list.innerHTML = '';
  if (notes.length === 0) {
    list.innerHTML = '<div style="color:#4a9ebe;text-align:center;padding:20px;font-size:12px;">Пусто. Скажите "запиши..." или добавьте ниже.</div>';
    return;
  }
  notes.forEach((note, i) => {
    const div = document.createElement('div');
    div.className = 'note-item' + (note.done ? ' done' : '');
    div.innerHTML = `
      <span class="note-text">${escapeHtml(note.text)}</span>
      <span class="note-time">${note.time || ''}</span>
      <span class="note-actions">
        <button class="done-btn" onclick="toggleNote(${i})">${note.done ? '↺' : '✓'}</button>
        <button class="del-btn" onclick="deleteNote(${i})">✕</button>
      </span>`;
    list.appendChild(div);
  });
  updateNotesCount();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function addNote(text) {
  if (!text || !text.trim()) return;
  const time = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  notes.push({ text: text.trim(), done: false, time });
  saveNotes();
  renderNotes();
}

function toggleNote(i) { notes[i].done = !notes[i].done; saveNotes(); renderNotes(); }
function deleteNote(i) { notes.splice(i, 1); saveNotes(); renderNotes(); }
function addNoteFromInput() { const inp = document.getElementById('noteInput'); addNote(inp.value); inp.value = ''; }

function toggleNotes() {
  document.getElementById('notesPanel').classList.toggle('open');
  if (document.getElementById('notesPanel').classList.contains('open')) renderNotes();
}
renderNotes();

// ============================================================
//              ОТКРЫТИЕ ССЫЛОК
// ============================================================
function openUrl(url) {
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => document.body.removeChild(a), 100);
}

// ============================================================
//              ГЕНЕРАЦИЯ КАРТИНОК
// ============================================================
async function generateImage(prompt) {
  const cleanPrompt = prompt.trim().replace(/[^\wа-яА-ЯёЁ\s,.-]/g, '');
  if (!cleanPrompt) return null;
  const seed = Math.floor(Math.random() * 1000000);
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt)}?width=512&height=512&seed=${seed}&nologo=true`;
  return { url, prompt: cleanPrompt };
}

// ============================================================
//              ПЕРЕВОДЧИК
// ============================================================
const LANG_NAMES = {
  'английский': 'en', 'english': 'en', 'en': 'en',
  'русский': 'ru', 'russian': 'ru', 'ru': 'ru',
  'немецкий': 'de', 'german': 'de', 'de': 'de',
  'французский': 'fr', 'french': 'fr', 'fr': 'fr',
  'испанский': 'es', 'spanish': 'es', 'es': 'es',
  'итальянский': 'it', 'italian': 'it', 'it': 'it',
  'китайский': 'zh', 'chinese': 'zh', 'zh': 'zh',
  'японский': 'ja', 'japanese': 'ja', 'ja': 'ja',
  'корейский': 'ko', 'korean': 'ko', 'ko': 'ko',
  'арабский': 'ar', 'arabic': 'ar', 'ar': 'ar',
  'турецкий': 'tr', 'turkish': 'tr', 'tr': 'tr',
  'польский': 'pl', 'polish': 'pl', 'pl': 'pl',
  'украинский': 'uk', 'ukrainian': 'uk', 'uk': 'uk',
  'татарский': 'tt', 'tatar': 'tt', 'tt': 'tt',
};

async function translateText(text, targetLang, sourceLang = 'ru') {
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.responseData && data.responseData.translatedText) {
      return data.responseData.translatedText;
    }
    if (data.responseStatus === 403) {
      return '❌ Лимит переводчика исчерпан (1000 слов/день). Попробуйте позже.';
    }
    return '❌ Не удалось перевести';
  } catch (e) {
    return '❌ Ошибка перевода: ' + e.message;
  }
}

let gestureActive = false;
let gestureStream = null;
let handsModel = null;
let cameraLoop = null;
let lastGesture = '';
let gestureCooldown = 0;

async function toggleGestures() {
  if (gestureActive) {
    gestureActive = false;
    document.getElementById('cameraPanel').classList.remove('active');
    document.getElementById('gestureBtn').classList.remove('recording');
    document.getElementById('gestureBtn').textContent = '✋ ЖЕСТЫ';
    if (gestureStream) { gestureStream.getTracks().forEach(t => t.stop()); gestureStream = null; }
    if (cameraLoop) cancelAnimationFrame(cameraLoop);
    cameraLoop = null;
    addLog('Система', '✋ Жесты выключены');
    return;
  }
  try {
    if (!handsModel) {
      addLog('Система', '⏳ Загружаю модель MediaPipe...');
      await loadMediaPipe();
    }
    gestureStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: 'user' } });
    const video = document.getElementById('gestureVideo');
    video.srcObject = gestureStream;
    await video.play();
    document.getElementById('cameraPanel').classList.add('active');
    document.getElementById('gestureBtn').classList.add('recording');
    document.getElementById('gestureBtn').textContent = '⏹ ЖЕСТЫ';
    gestureActive = true;
    addLog('Система', '✋ Жесты: ☝️ погода · ✌️ время · 🤟 факт · 🖖 микрофон · ✋ картинка · 👏 хлопок — Казань · ✊ стоп');
    detectGestures();
  } catch (e) {
    addLog('Система', '❌ Ошибка камеры: ' + e.message);
  }
}

function loadMediaPipe() {
  return new Promise((resolve, reject) => {
    if (window.Hands) { resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';
    script.crossOrigin = 'anonymous';
    script.onload = () => {
      handsModel = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
      handsModel.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
      handsModel.onResults(onGestureResults);
      resolve();
    };
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

function onGestureResults(results) {
  const info = document.getElementById('gestureInfo');
  const hands = results.multiHandLandmarks;

  if (!hands || hands.length === 0) {
    info.textContent = 'Покажите руку в кадр';
    lastGesture = '';
    return;
  }

  if (hands.length === 2) {
    const h1 = hands[0][9];
    const h2 = hands[1][9];
    const distance = Math.sqrt(Math.pow(h1.x - h2.x, 2) + Math.pow(h1.y - h2.y, 2));
    if (distance < 0.18) {
      info.textContent = '👏 Двойной хлопок!';
      const now = Date.now();
      if (now - gestureCooldown > 4000) {
        gestureCooldown = now;
        handleGesture('👏 Двойной хлопок');
      }
      return;
    }
  }

  const landmarks = hands[0];
  const gesture = detectGestureFromLandmarks(landmarks);
  if (gesture) {
    info.textContent = gesture.name;
    const now = Date.now();
    if (gesture.name !== lastGesture || now - gestureCooldown > 3000) {
      lastGesture = gesture.name;
      gestureCooldown = now;
      handleGesture(gesture.name);
    }
  } else {
    info.textContent = 'Рука в кадре';
  }
}

function detectGestureFromLandmarks(lm) {
  const fingersUp = [];
  fingersUp.push(lm[8].y  < lm[6].y  ? 1 : 0);
  fingersUp.push(lm[12].y < lm[10].y ? 1 : 0);
  fingersUp.push(lm[16].y < lm[14].y ? 1 : 0);
  fingersUp.push(lm[20].y < lm[18].y ? 1 : 0);
  const count = fingersUp.reduce((a, b) => a + b, 0);
  if (count === 0) return { name: '✊ Кулак', action: 'stop' };
  if (count === 1 && fingersUp[0]) return { name: '☝️ Один палец', action: 'weather' };
  if (count === 2 && fingersUp[0] && fingersUp[1]) return { name: '✌️ Два пальца', action: 'time' };
  if (count === 3) return { name: '🤟 Три пальца', action: 'fact' };
  if (count === 4) return { name: '🖖 Четыре пальца', action: 'microphone' };
  if (count === 5) return { name: '✋ Ладонь', action: 'image' };
  return null;
}

function handleGesture(name) {
  const actions = {
    '✊ Кулак': () => {
      speechSynthesis.cancel();
      if (recog && listening) recog.stop();
      addLog('Система', '✊ Стоп');
    },
    '☝️ Один палец': () => processCommand('погода в Казани'),
    '✌️ Два пальца': () => processCommand('сколько времени'),
    '🤟 Три пальца': () => processCommand('расскажи факт'),
    '🖖 Четыре пальца': () => {
      if (listening) { addLog('Система', '🎙 Микрофон уже слушает'); return; }
      addLog('Система', '🖖 Четыре пальца → разовый микрофон');
      speak('Слушаю, сэр');
      setTimeout(() => {
        if (recog && !listening) { try { recog.start(); } catch (e) {} }
      }, 1200);
    },
    '✋ Ладонь': () => processCommand('нарисуй космический пейзаж'),
    '👏 Двойной хлопок': () => processCommand('сводка казань'),
  };
  if (actions[name]) actions[name]();
}

async function detectGestures() {
  if (!gestureActive) return;
  const video = document.getElementById('gestureVideo');
  if (video.readyState === 4) { try { await handsModel.send({ image: video }); } catch (e) {} }
  cameraLoop = requestAnimationFrame(detectGestures);
}

async function searchAnswer(question) {
  const q = question.trim();
  if (!q) return 'Какой вопрос, мистер Старк?';

  try {
    const url = `https://ru.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`;
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      if (data.extract && data.extract.length > 20) {
        let text = data.extract;
        if (text.length > 500) text = text.slice(0, 500) + '...';
        return text;
      }
    }
  } catch (e) {}

  try {
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`;
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      if (data.extract && data.extract.length > 20) {
        let text = data.extract;
        if (text.length > 500) text = text.slice(0, 500) + '...';
        return text;
      }
    }
  } catch (e) {}

  try {
    const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.AbstractText && data.AbstractText.length > 20) {
      let text = data.AbstractText;
      if (text.length > 500) text = text.slice(0, 500) + '...';
      return text;
    }
    if (data.Answer) return data.Answer;
    if (data.Definition) return data.Definition;
  } catch (e) {}

  openUrl('https://www.google.com/search?q=' + encodeURIComponent(q));
  return `Не нашёл точного ответа. Открыл Google.`;
}

function extractQuestion(cmd) {
  return cmd
    .replace(/^(расскажи|объясни|ответь|скажи|подскажи|что ты знаешь|что известно)\s+(мне\s+)?(про|о|об|что такое|кто такой|кто такая)?\s*/i, '')
    .replace(/^(что такое|кто такой|кто такая|что значит|что означает)\s+/i, '')
    .replace(/[?.!]+$/, '')
    .trim();
}

async function getWeather(cityName) {
  try {
    let lat, lon, city;
    let cleanCity = (cityName || '').toLowerCase().replace(/^в\s+|^во\s+/i, '').replace(/[?.!,]/g, '').trim();
    if (CITIES[cleanCity]) { lat = CITIES[cleanCity].lat; lon = CITIES[cleanCity].lon; city = CITIES[cleanCity].name; }
    else if (!cleanCity) {
      const pos = await new Promise((res, rej) => {
        if (!navigator.geolocation) rej('no geo');
        navigator.geolocation.getCurrentPosition(res, rej, { timeout: 5000 });
      });
      lat = pos.coords.latitude; lon = pos.coords.longitude; city = 'вашем местоположении';
    } else {
      const geoUrl = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(cleanCity) + '&count=1&language=ru&format=json';
      const geoRes = await fetch(geoUrl);
      const geoData = await geoRes.json();
      if (!geoData.results || geoData.results.length === 0) return `Не нашёл город "${cityName}"`;
      lat = geoData.results[0].latitude; lon = geoData.results[0].longitude; city = geoData.results[0].name;
    }
    const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;
    const wRes = await fetch(weatherUrl);
    const wData = await wRes.json();
    const cur = wData.current;
    const codes = { 0: 'ясно', 1: 'преимущественно ясно', 2: 'переменная облачность', 3: 'облачно', 45: 'туман', 51: 'морось', 61: 'небольшой дождь', 63: 'дождь', 65: 'сильный дождь', 71: 'небольшой снег', 73: 'снег', 75: 'сильный снег', 80: 'ливень', 95: 'гроза' };
    const desc = codes[cur.weather_code] || 'неизвестно';
    return `В ${city} сейчас ${desc}, ${Math.round(cur.temperature_2m)}°C (ощущается как ${Math.round(cur.apparent_temperature)}°C), влажность ${cur.relative_humidity_2m}%, ветер ${Math.round(cur.wind_speed_10m)} м/с.`;
  } catch (e) { return 'Не удалось получить погоду.'; }
}

async function solveTask(cmd) {
  try {
    let expr = cmd.replace(/посчитай|сколько будет|реши|вычисли|найди значение|решить задачу/gi, '').replace(/\s+/g, ' ').trim();
    if (!expr) return 'Что решить, сэр?';
    const replacements = [
      [/\bплюс\b/g, '+'], [/\bминус\b/g, '-'],
      [/\bумножить на\b/g, '*'], [/\bумножить\b/g, '*'],
      [/\bразделить на\b/g, '/'], [/\bразделить\b/g, '/'],
      [/\bв квадрате\b/g, '**2'], [/\bв кубе\b/g, '**3'],
      [/\bкорень из\b/g, 'sqrt'], [/\bпроцент от\b/g, '% of'],
      [/\bикс\b|\bх\b/g, 'x'],
      [/[×х]/g, '*'], [/[÷:]/g, '/'], [/,/g, '.'],
    ];
    let n = expr.toLowerCase();
    for (const [p, r] of replacements) n = n.replace(p, r);
    const pctMatch = n.match(/^(\d+(?:\.\d+)?)\s*%?\s*(?:от|of)\s*(\d+(?:\.\d+)?)$/);
    if (pctMatch) return `${pctMatch[1]}% от ${pctMatch[2]} = ${(parseFloat(pctMatch[1]) / 100) * parseFloat(pctMatch[2])}`;
    const sqrtMatch = n.match(/sqrt\s*(\d+(?:\.\d+)?)/);
    if (sqrtMatch) return `√${sqrtMatch[1]} = ${Math.sqrt(parseFloat(sqrtMatch[1]))}`;
    let clean = n.replace(/[^0-9+\-*/().\s]/g, '').trim();
    if (!clean) return 'Не понял, что решить';
    const result = Function('"use strict"; return (' + clean + ')')();
    if (result === undefined || isNaN(result)) return 'Не смог решить';
    const rounded = Number.isInteger(result) ? result : parseFloat(result.toFixed(4));
    return `${clean} = ${rounded}`;
  } catch (e) { return 'Ошибка в выражении'; }
}

const canvas = document.getElementById('reactor');
const ctx = canvas.getContext('2d');
let angle = 0, pulse = 0, state = 'idle';
const colors = { idle: { main: '#00d4ff' }, listening: { main: '#00ff88' }, speaking: { main: '#ff8800' }, thinking: { main: '#c084fc' } };
function hexA(hex, a) { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r},${g},${b},${a})`; }
function drawReactor() {
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2, maxR = Math.min(w, h) / 2 - 8;
  const col = colors[state] || colors.idle;
  ctx.clearRect(0, 0, w, h);
  for (let i = 0; i < 12; i++) {
    const a = (angle + i * 30) * Math.PI / 180, r = maxR - 6;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    const size = 2.5 + 2 * Math.sin(pulse * 2 + i);
    ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = col.main; ctx.shadowBlur = 10; ctx.shadowColor = col.main; ctx.fill();
  }
  ctx.shadowBlur = 0;
  [[maxR - 22, 2, 0.45], [maxR - 38, 1, 0.25], [maxR - 55, 3, 0.6]].forEach(([r, lw, a]) => {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = hexA(col.main, a); ctx.lineWidth = lw; ctx.stroke();
  });
  ctx.beginPath();
  ctx.arc(cx, cy, maxR - 30, (angle * Math.PI) / 180, ((angle + 60) * Math.PI) / 180);
  ctx.strokeStyle = col.main; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  const coreR = maxR * 0.35 + 6 * Math.sin(pulse);
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.4, col.main); grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, coreR * 0.35, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  ctx.fillStyle = '#0a0e17'; ctx.font = `bold ${coreR * 0.55}px Consolas, monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('J', cx, cy);
  angle = (angle + 2) % 360; pulse = (pulse + 0.08) % (Math.PI * 2);
  requestAnimationFrame(drawReactor);
}
drawReactor();

let voices = [], selectedVoice = null, voiceIndex = 0, maleVoices = [];
const PREFERRED_MALE = ['Microsoft Dmitry', 'Microsoft Pavel', 'Dmitry', 'Pavel', 'Yuri', 'Yuriy', 'Google UK English Male', 'Daniel', 'Microsoft George', 'Microsoft Ryan', 'Microsoft David', 'Microsoft Mark'];
function isMaleVoice(v) { return /(dmitry|pavel|yuri|yuriy|male|george|daniel|ryan|david|mark|alex|fred|arthur)/i.test(v.name); }
function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (voices.length === 0) return;
  maleVoices = [];
  for (const name of PREFERRED_MALE) {
    const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (found && !maleVoices.includes(found)) maleVoices.push(found);
  }
  for (const v of voices) if (isMaleVoice(v) && !maleVoices.includes(v)) maleVoices.push(v);
  maleVoices.sort((a, b) => (a.lang.startsWith('ru') ? 0 : 1) - (b.lang.startsWith('ru') ? 0 : 1));
  if (maleVoices.length > 0) selectedVoice = maleVoices[voiceIndex % maleVoices.length];
  else selectedVoice = voices.find(v => v.lang.startsWith('ru')) || voices[0];
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 500);
setTimeout(loadVoices, 1500);

if (voiceBtn) {
  voiceBtn.onclick = () => {
    if (maleVoices.length === 0) { addLog('Система', 'Мужских голосов нет.'); return; }
    voiceIndex = (voiceIndex + 1) % maleVoices.length;
    selectedVoice = maleVoices[voiceIndex];
    addLog('Система', `Голос: <b>${selectedVoice.name}</b>`);
    speak('Голос активирован');
  };
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  if (!selectedVoice) loadVoices();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = selectedVoice; u.lang = selectedVoice ? selectedVoice.lang : 'ru-RU';
  u.rate = 0.85; u.pitch = 0.55; u.volume = 1.0;
  setState('speaking');
  u.onend = () => setState('idle');
  u.onerror = () => setState('idle');
  speechSynthesis.speak(u);
}

// ============================================================
//              МИКРОФОН
// ============================================================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let listening = false;

function setMicState(state, text) {
  if (!micStateEl) return;
  micStateEl.textContent = text;
  micStateEl.className = state;
}

if (!SR) {
  setMicState('bad', 'NO SR');
  if (micBtn) {
    micBtn.disabled = true;
    micBtn.textContent = '❌ Нет поддержки';
  }
  addLog('Система', '❌ Браузер не поддерживает распознавание речи. Используйте Chrome или Edge.');
} else {
  recog = new SR();
  recog.lang = 'ru-RU';
  recog.continuous = false;
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  recog.onstart = () => {
    listening = true;
    setState('listening');
    if (micBtn) {
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹ СТОП';
    }
    setMicState('ok', 'ON');
    addLog('Система', '🎤 Слушаю...');
  };

  recog.onresult = (e) => {
    const text = e.results[0][0].transcript;
    addLog('Ты', text);
    processCommand(text);
  };

  recog.onerror = (e) => {
    console.error('Speech error:', e.error);
    setMicState('bad', 'ERR');
    let msg = '';
    switch (e.error) {
      case 'not-allowed':
      case 'service-not-allowed':
        msg = '❌ Доступ к микрофону запрещён. Нажмите 🔒 → Микрофон → Разрешить.';
        break;
      case 'no-speech':
        msg = '🔇 Речь не распознана. Попробуйте ещё раз.';
        break;
      case 'audio-capture':
        msg = '❌ Микрофон не найден.';
        break;
      case 'network':
        msg = '❌ Нет интернета — распознавание требует сеть.';
        break;
      case 'aborted':
        msg = '⏹ Запись прервана.';
        break;
      default:
        msg = '⚠️ Ошибка микрофона: ' + e.error;
    }
    addLog('Система', msg);
  };

  recog.onend = () => {
    listening = false;
    if (micBtn) {
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤 СЛУШАТЬ';
    }
    setMicState('bad', 'OFF');
    if (state === 'listening') setState('idle');
  };
}

if (micBtn) {
  micBtn.onclick = async () => {
    if (!SR) {
      alert('Ваш браузер не поддерживает распознавание речи.\n\nОткройте страницу в Chrome или Edge.');
      return;
    }

    try {
      if (navigator.permissions && navigator.permissions.query) {
        const perm = await navigator.permissions.query({ name: 'microphone' });
        if (perm.state === 'denied') {
          addLog('Система', '❌ Микрофон запрещён');
          setMicState('bad', 'DENIED');
          alert(
            '❌ Доступ к микрофону запрещён.\n\n' +
            '1. Нажмите 🔒 или ⓘ слева от адреса\n' +
            '2. Найдите "Микрофон"\n' +
            '3. Разрешите\n' +
            '4. Перезагрузите (F5)'
          );
          return;
        }
      }
    } catch (e) {}

    if (listening) {
      try { recog.stop(); } catch (e) {}
      return;
    }

    try {
      recog.start();
    } catch (e) {
      console.error('Start error:', e);
      if (e.name === 'InvalidStateError') {
        addLog('Система', '⚠️ Микрофон уже запущен');
      } else {
        addLog('Система', '❌ Не удалось запустить: ' + e.message);
      }
    }
  };
}

if (navigator.permissions && navigator.permissions.query && SR) {
  navigator.permissions.query({ name: 'microphone' }).then(perm => {
    if (perm.state === 'granted') setMicState('ok', 'READY');
    else if (perm.state === 'denied') {
      setMicState('bad', 'DENIED');
      addLog('Система', '⚠️ Микрофон запрещён. Нажмите 🔒 → Разрешить.');
    } else {
      setMicState('bad', 'ASK');
    }
  }).catch(() => {
    setMicState('bad', '?');
  });
}

// ============================================================
//              ОБРАБОТКА КОМАНД
// ============================================================
async function processCommand(raw) {
  const cmd = raw.toLowerCase().trim();
  if (!cmd) return;
  setState('thinking');
  await new Promise(r => setTimeout(r, 150));
  let answer = '';

  try {
    // ПЕРЕВОД
    if (/переведи|перевод|translate/.test(cmd)) {
      let text = '';
      let targetLang = 'en';
      let sourceLang = 'ru';

      // Формат: "переведи на английский привет"
      let m = cmd.match(/переведи\s+(?:на|в)\s+(\S+)\s+(.+)/i);
      if (m) {
        targetLang = LANG_NAMES[m[1].toLowerCase()] || 'en';
        text = m[2].trim();
      } else {
        // Формат: "переведи привет на английский"
        m = cmd.match(/переведи\s+(.+?)\s+(?:на|в)\s+(\S+)$/i);
        if (m) {
          text = m[1].trim();
          targetLang = LANG_NAMES[m[2].toLowerCase()] || 'en';
        } else {
          // Просто "переведи что-то" → на английский
          text = cmd.replace(/переведи|перевод|translate/gi, '').trim();
          targetLang = 'en';
        }
      }

      if (!text) {
        answer = 'Что перевести? Скажите: "переведи на английский привет"';
      } else {
        // Определяем исходный язык: если в тексте кириллица — русский, иначе английский
        sourceLang = /[а-яё]/i.test(text) ? 'ru' : 'en';
        addLog('Система', `🌍 Перевожу "${text}" на ${targetLang}...`);
        const translation = await translateText(text, targetLang, sourceLang);
        answer = `🌍 "${text}" → ${translation}`;
      }
    }
    else if (/нарисуй|сгенерируй картинку|создай изображение|покажи картинку/.test(cmd)) {
      const prompt = cmd.replace(/нарисуй|сгенерируй картинку|создай изображение|покажи картинку/gi, '').trim();
      if (!prompt) { answer = 'Что нарисовать, мистер Старк?'; }
      else {
        addLog('Система', `🎨 Генерирую: "${prompt}"...`);
        const img = await generateImage(prompt);
        if (img) {
          answer = `Готово: "${prompt}"`;
          const logEl = document.createElement('div');
          logEl.className = 'log-entry jarvis';
          logEl.innerHTML = `<span class="time">[${new Date().toLocaleTimeString('ru-RU')}]</span> 🎨 <span class="who">JARVIS:</span> <img src="${img.url}" alt="${img.prompt}" loading="lazy">`;
          logBox.appendChild(logEl);
          logBox.scrollTop = logBox.scrollHeight;
        } else answer = 'Не удалось сгенерировать';
      }
    }
    else if (/ночной режим|ночная тема|режим ночь/.test(cmd)) {
      answer = toggleNightMode() + ', мистер Старк';
    }
    else if (/^(запиши|добавь заметку|напомни|запомни)\s+(.+)$/i.test(cmd)) {
      const m = cmd.match(/^(запиши|добавь заметку|напомни|запомни)\s+(.+)$/i);
      addNote(m[2].trim());
      answer = `Записал: "${m[2].trim()}"`;
    }
    else if (/^(покажи|открой) (мои )?(заметки|список дел|дела)/i.test(cmd)) {
      toggleNotes();
      answer = `У вас ${notes.filter(n => !n.done).length} активных заметок`;
    }
    else if (/^(очисти|удали) (все )?(заметки|дела)/i.test(cmd)) {
      notes = []; saveNotes(); renderNotes();
      answer = 'Все заметки удалены';
    }
    else if (/сводка казань|всё про казань|сводка по казани/.test(cmd)) {
      addLog('Система', '📊 Собираю сводку по Казани...');
      answer = await getKazanSummary();
    }
    else if (/погод|сколько градусов|температура|градус/.test(cmd)) {
      let city = cmd.replace(/какая\s+погода|погода|погоду|сколько\s+градусов|температура|градусов|градус/gi, '').replace(/^в\s+|^во\s+/gi, '').replace(/[?.!,]/g, '').trim();
      answer = await getWeather(city);
    }
    else if (/посчитай|сколько будет|реши|вычисли/.test(cmd)) answer = await solveTask(cmd);
    else if (/^(открой|запусти|включи)\s+(роблокс|roblox)$/i.test(cmd)) {
      const url = 'https://www.roblox.com';
      answer = 'Открываю Roblox'; openUrl(url);
    }
    else if (/роблокс|roblox/i.test(cmd)) {
      const rbMatch = cmd.match(/(?:открой|запусти|включи)\s+(?:роблокс[е]?\s+)?(?:игру\s+)?(.+?)(?:\s+в\s+роблоксе?)?$/i);
      if (rbMatch) {
        const gameName = rbMatch[1].trim();
        const gameId = findRobloxGame(gameName);
        const url = gameId ? 'https://www.roblox.com/games/' + gameId : 'https://www.roblox.com/search/games?keyword=' + encodeURIComponent(gameName);
        answer = `Открываю "${gameName}"`;
        openUrl(url);
      }
    }
    else if (/^включи\s+(?:фильм|мультфильм|сериал|кино)\s+(.+)$/i.test(cmd)) {
      const m = cmd.match(/^включи\s+(?:фильм|мультфильм|сериал|кино)\s+(.+)$/i);
      const url = 'https://vkvideo.ru/search?q=' + encodeURIComponent(m[1]);
      answer = `Включаю "${m[1]}"`;
      openUrl(url);
    }
    else if (/смени тему|поменяй тему/.test(cmd)) {
      const themes = ['theme-blue', 'theme-red', 'theme-green', 'theme-purple', 'theme-orange'];
      const names = ['синяя', 'красная', 'зелёная', 'фиолетовая', 'оранжевая'];
      let cur = parseInt(localStorage.getItem('jarvis_theme') || '0');
      cur = (cur + 1) % themes.length;
      localStorage.setItem('jarvis_theme', cur);
      document.body.className = themes[cur];
      answer = `Тема: ${names[cur]}`;
    }
    else if (/смени голос|другой голос/.test(cmd)) { if (voiceBtn) voiceBtn.click(); return; }
    else if (/включи жесты|распознавание рук|включи камеру/.test(cmd)) {
      toggleGestures();
      answer = 'Включаю распознавание жестов';
    }
    else if (/выключи жесты|выключи камеру/.test(cmd)) {
      if (gestureActive) toggleGestures();
      answer = 'Выключаю камеру';
    }
    else if (/\b(привет|здравствуй|добрый (день|вечер|утро))\b/.test(cmd)) {
      const h = new Date().getHours();
      if (h >= 6 && h < 12) answer = 'Здравствуйте, мистер Старк. Доброе утро.';
      else if (h < 18) answer = 'Здравствуйте, мистер Старк. Добрый день.';
      else if (h < 23) answer = 'Здравствуйте, мистер Старк. Добрый вечер.';
      else answer = 'Здравствуйте, мистер Старк. Доброй ночи.';
    }
    else if (/\b(время|час|часов)\b/.test(cmd) && !/сколько.*времени/.test(cmd)) {
      answer = `Сейчас ${new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}, мистер Старк`;
    }
    else if (/\b(дата|число|день)\b/.test(cmd)) {
      const d = new Date();
      const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
      answer = `Сегодня ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}, ${days[d.getDay()]}, мистер Старк`;
    }
    else if (/^(найди|загугли|поищи)\s+/.test(cmd)) {
      const q = cmd.replace(/^(найди|загугли|поищи)\s+/, '');
      const url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
      answer = `Ищу: ${q}`; openUrl(url);
    }
    else if (/^(что такое|кто такой|кто такая|что значит|расскажи про|объясни)/.test(cmd) ||
             cmd.includes('?') || /^(как|почему|зачем|где|когда|какой|какая|чем)\s+/.test(cmd)) {
      setState('thinking');
      addLog('Система', '🔎 Ищу ответ...');
      const q = extractQuestion(cmd);
      if (q.length < 3) answer = 'Уточните вопрос';
      else answer = await searchAnswer(q);
    }
    else if (/включи.*(ютуб|youtube)/.test(cmd)) {
      const q = cmd.replace(/включи|на ютубе|в ютубе|ютуб|youtube/g, '').trim();
      const url = q ? 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q) : 'https://www.youtube.com';
      answer = q ? `Включаю "${q}"` : 'Открываю YouTube'; openUrl(url);
    }
    else if (/(открой|запусти)?\s*(телеграм|телеграмм|telegram|тг)/i.test(cmd)) {
      answer = 'Открываю Telegram'; openUrl('https://web.telegram.org');
    }
    else if (/открой (вк|вконтакте|vk)/i.test(cmd)) { answer = 'Открываю ВК'; openUrl('https://vk.com'); }
    else if (/открой (гугл|google)/i.test(cmd)) { answer = 'Открываю Google'; openUrl('https://google.com'); }
    else if (/открой (яндекс)/i.test(cmd)) { answer = 'Открываю Яндекс'; openUrl('https://yandex.ru'); }
    else if (/шутк|анекдот/.test(cmd)) {
      const jokes = [
        'Почему программисты путают Хэллоуин и Рождество? Потому что OCT 31 равно DEC 25.',
        'Есть 10 типов людей: те, кто понимает двоичную систему, и те, кто нет.',
        'Я не ленивый, я в режиме энергосбережения.',
      ];
      answer = jokes[Math.floor(Math.random() * jokes.length)];
    }
    else if (/очисти|убери|стереть/.test(cmd)) { logBox.innerHTML = ''; answer = 'Лог очищен'; }
    else if (/помощь|команды|что ты умеешь/.test(cmd)) {
      answer = 'Я умею: переводить ("переведи на английский привет"), отвечать на вопросы, погоду, задачи, рисунки, заметки, ночной режим, темы, Roblox, фильмы, сайты, жесты. 👏 Хлопок ладонями — сводка по Казани.';
    }
    else if (/стоп|выход|отключись/.test(cmd)) {
      answer = 'Отключаюсь. Хорошего дня, мистер Старк!';
      speechSynthesis.cancel();
    }
    else {
      if (cmd.length > 3) {
        setState('thinking');
        addLog('Система', '🔎 Ищу ответ...');
        answer = await searchAnswer(cmd);
      } else answer = `Не понял "${raw}". Скажите "помощь".`;
    }
  } catch (e) {
    answer = 'Ошибка: ' + e.message;
  }

  if (answer) { addLog('JARVIS', answer); speak(answer); }
}

// ============================================================
//              КНОПКИ
// ============================================================
if (sendBtn) {
  sendBtn.onclick = () => {
    const text = input.value.trim();
    if (!text) return;
    addLog('Ты', text);
    input.value = '';
    processCommand(text);
  };
}
if (input) input.onkeydown = (e) => { if (e.key === 'Enter' && sendBtn) sendBtn.click(); };
if (rbxBtn) rbxBtn.onclick = () => processCommand('открой роблокс');
if (weatherBtn) weatherBtn.onclick = () => processCommand('погода в Казани');
if (themeBtn) themeBtn.onclick = () => processCommand('смени тему');
if (notesBtn) notesBtn.onclick = () => toggleNotes();
if (nightBtn) nightBtn.onclick = () => processCommand('ночной режим');
if (gestureBtn) gestureBtn.onclick = () => toggleGestures();
if (kazanBtn) kazanBtn.onclick = () => processCommand('сводка казань');
if (translateBtn) {
  translateBtn.onclick = () => {
    const p = prompt('🌍 Что перевести? (например: на английский привет)');
    if (p && p.trim()) processCommand('переведи ' + p.trim());
  };
}
if (imgBtn) {
  imgBtn.onclick = () => {
    const p = prompt('🎨 Что нарисовать?');
    if (p && p.trim()) processCommand('нарисуй ' + p.trim());
  };
}
if (stopBtn) {
  stopBtn.onclick = () => {
    speechSynthesis.cancel();
    if (recog && listening) recog.stop();
    setState('idle');
    addLog('Система', 'Остановлено');
  };
}
if (clearBtn) clearBtn.onclick = () => { logBox.innerHTML = ''; };

document.getElementById('noteInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addNoteFromInput();
});

const savedTheme = localStorage.getItem('jarvis_theme');
if (savedTheme) {
  const themes = ['theme-blue', 'theme-red', 'theme-green', 'theme-purple', 'theme-orange'];
  document.body.className = themes[parseInt(savedTheme)] || 'theme-blue';
}

// ============================================================
//              ЧАСЫ
// ============================================================
function updateClock() {
  const now = new Date();
  const t = document.getElementById('time');
  const d = document.getElementById('date');
  if (t) t.textContent = now.toLocaleTimeString('ru-RU');
  if (d) d.textContent = now.toLocaleDateString('ru-RU');
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
//              СТАРТ
// ============================================================
window.addEventListener('load', () => {
  setTimeout(() => {
    loadVoices();
    checkNightMode();
    const h = new Date().getHours();
    let greet = 'Добрый день';
    if (h >= 6 && h < 12)  greet = 'Доброе утро';
    else if (h >= 18 && h < 23) greet = 'Добрый вечер';
    else if (h >= 23 || h < 6) greet = 'Доброй ночи';
    addLog('JARVIS', `${greet}, мистер Старк. Скажите "помощь" или нажмите "🌍 ПЕРЕВОД".`);
  }, 1000);
});

document.body.addEventListener('click', function once() {
  if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    setTimeout(loadVoices, 100);
  }
  document.body.removeEventListener('click', once);
}, { once: true });
</script>
